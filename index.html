<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRTI Alliance Transfers</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>DRTI Alliance Transfers</h1>
<p class="lead">Complete the form below if you're interested in transferring to DRTI.</p>

<div class="notice">
<p>Please keep in mind that we can't guarantee we'll be able to bring everyone, but we'll do our best.</p>
<p>If possible, keep your THP below <strong>185M–190M</strong>, as purple seats are limited.</p>
</div>

<form id="transferForm">
<label>Nickname</label>
<input required>

<label>Current Server</label>
<input required>

<label>THP</label>
<input required>

<label>T1 Type</label>
<select required>
<option>Aircraft</option>
<option>Tank</option>
<option>Missile</option>
</select>

<label>T1 Power</label>
<input required>

<label>Total Kills</label>
<input required>

<label>Discord (optional)</label>
<input>

<label>Additional Notes</label>
<textarea rows="4"></textarea>

<button type="submit">Submit Registration</button>
</form>

<p id="msg"></p>
</div>

<script src="script.js"></script>
</body>
</html>
